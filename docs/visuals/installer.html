<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
body{width:1600px;height:640px;padding:60px 72px}
h2{font-size:38px;letter-spacing:-1.3px;font-weight:800;margin-top:10px}
.lede{font-size:19px;color:var(--muted);margin-top:10px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:40px}
figure{display:flex;flex-direction:column;gap:14px}
figure .frame{background:#fff;border-radius:12px;padding:0;overflow:hidden}
figure img{width:100%;display:block}
figcaption .n{font-family:"DM Mono",monospace;font-size:13px;color:var(--red)}
figcaption b{display:block;font-size:17px;margin-top:2px}
figcaption span{font-size:14.5px;color:var(--muted);line-height:1.5}
</style></head>
<body>
<div class="eyebrow">Install</div>
<h2>Four steps. No admin rights. Your default app stays your choice.</h2>
<p class="lede">The installer speaks Indonesian on Indonesian Windows and English everywhere else.</p>
<div class="row">
  <figure><img class="shot" src="../assets/install-id-1-welcome.png"><figcaption><span class="n">01</span><b>Welcome</b><span>What PenaDF does and how much space it needs.</span></figcaption></figure>
  <figure><img class="shot" src="../assets/install-id-2-licence.png"><figcaption><span class="n">02</span><b>Licence and privacy</b><span>One plain page: free, offline, what it stores, no warranty.</span></figcaption></figure>
  <figure><img class="shot" src="../assets/install-id-3-folder.png"><figcaption><span class="n">03</span><b>Folder</b><span>Installs under your account, about 16 MB.</span></figcaption></figure>
  <figure><img class="shot" src="../assets/install-id-4-finish.png"><figcaption><span class="n">04</span><b>Finish</b><span>Open PenaDF, and optionally make it the default PDF app.</span></figcaption></figure>
</div>
</body></html>
