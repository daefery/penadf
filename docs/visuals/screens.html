<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
body{width:1600px;height:1020px;padding:60px 72px}
h2{font-size:38px;letter-spacing:-1.3px;font-weight:800;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px 26px;margin-top:38px}
figure{display:flex;flex-direction:column;gap:12px}
figure img{width:100%;aspect-ratio:1200/800;object-fit:cover;object-position:top left}
figcaption{display:flex;gap:10px;align-items:baseline}
figcaption .n{font-family:"DM Mono",monospace;font-size:13px;color:var(--red)}
figcaption b{font-size:17px}
figcaption span{font-size:14.5px;color:var(--muted)}
</style></head>
<body>
<div class="eyebrow">The app</div>
<h2>Real screens, with a fictional contract.</h2>
<div class="grid">
  <figure><img class="shot" src="../assets/screen-sign.png"><figcaption><span class="n">01</span><div><b>Sign</b><br><span>Draw once, place it with a drag.</span></div></figcaption></figure>
  <figure><img class="shot" src="../assets/screen-comments.png"><figcaption><span class="n">02</span><div><b>Comments</b><br><span>Highlights and notes, listed and deletable.</span></div></figcaption></figure>
  <figure><img class="shot" src="../assets/screen-compare.png"><figcaption><span class="n">03</span><div><b>Compare</b><br><span>What changed between two versions.</span></div></figcaption></figure>
  <figure><img class="shot" src="../assets/screen-search.png"><figcaption><span class="n">04</span><div><b>Find</b><br><span>Every match highlighted, one by one.</span></div></figcaption></figure>
  <figure><img class="shot" src="../assets/screen-organize.png"><figcaption><span class="n">05</span><div><b>Organize</b><br><span>Rotate, delete, insert, split, crop.</span></div></figcaption></figure>
  <figure><img class="shot" src="../assets/screen-protect.png"><figcaption><span class="n">06</span><div><b>Protect</b><br><span>Password and permissions, AES-256.</span></div></figcaption></figure>
</div>
</body></html>
