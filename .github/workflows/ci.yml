# Builds and tests on real Windows for every push and pull request.
# Pushing a tag like v0.2.0 also builds the installer and the zip and attaches them
# to a draft GitHub release (published by hand after a check).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: scripts/test.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test against macOS PDFium
        run: |
          mkdir -p /tmp/pdfium
          curl -sSL https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7881/pdfium-mac-univ.tgz | tar xz -C /tmp/pdfium
          PENADF_PDFIUM_DIR=/tmp/pdfium/lib cargo test --release
      - name: Third-party notices tool
        run: cargo install cargo-about --locked --features cli
      - name: Build PenaDF.app and the .dmg
        run: scripts/build-macos.sh
      - name: Smoke test the bundle (starts, finds PDFium, stays up)
        run: |
          APP=dist/PenaDF.app/Contents/MacOS/PenaDF
          "$APP" & PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "PenaDF is running"; kill $PID; else echo "PenaDF exited early"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: penadf-macos
          path: dist/PenaDF-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test against the bundled pdfium.dll
        shell: pwsh
        run: |
          $env:PENADF_PDFIUM_DIR = "$PWD\vendor\pdfium\windows"
          cargo test --release
      - name: Build
        run: cargo build --release
      - name: Third-party notices
        shell: bash
        run: |
          cargo install cargo-about --locked --features cli
          scripts/make_notices.sh
      - name: Package zip
        shell: pwsh
        run: |
          $out = "dist\PenaDF"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\release\penadf.exe "$out\PenaDF.exe"
          Copy-Item vendor\pdfium\windows\pdfium.dll $out
          Copy-Item THIRD-PARTY-NOTICES.txt $out
          Copy-Item LICENSE "$out\LICENSE.txt"
          Copy-Item README.md "$out\README.txt"
          Compress-Archive -Path $out -DestinationPath dist\PenaDF-windows-x64.zip -Force
      - name: Build installer
        shell: pwsh
        run: |
          winget install --id NSIS.NSIS --version 3.13 --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -V2 "-DVERSION=$version" "-DDIST=$PWD\dist\PenaDF" "-DOUTFILE=$PWD\dist\PenaDF-Setup-$version.exe" installer\penadf.nsi
      - name: Release files and checksums
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist\release | Out-Null
          # Fixed names so README links to releases/latest/download/... keep working.
          Copy-Item "dist\PenaDF-Setup-$version.exe" dist\release\PenaDF-Setup.exe
          Copy-Item dist\PenaDF-windows-x64.zip dist\release\
      - uses: actions/upload-artifact@v7
        with:
          name: penadf-windows
          path: dist/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dl
      - name: Files and checksums
        run: |
          mkdir -p release
          cp dl/penadf-windows/PenaDF-Setup.exe dl/penadf-windows/PenaDF-windows-x64.zip release/
          cp dl/penadf-macos/PenaDF-macOS.dmg release/
          (cd release && sha256sum PenaDF-Setup.exe PenaDF-windows-x64.zip PenaDF-macOS.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Draft release (only if the tag has no release yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as it is."
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "PenaDF ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md release/*
          fi
